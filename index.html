<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>חיפוש — סופ״ש בטבע</title>
    <meta
      name="description"
      content="חיפוש חניוני לילה, מסלולי הליכה, נקודות עניין ומצפורים, ואז הוספה לטיול."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="browse-page search-page">
    <header class="site-head">
      <a class="brand" href="index.html">סופ״ש בטבע</a>
      <nav class="site-nav" aria-label="אזורים">
        <a class="on" href="index.html">חיפוש</a>
        <a href="trips.html">הטיולים שלי</a>
      </nav>
    </header>
    <main class="workspace">
      <aside class="panel" aria-label="תוצאות חיפוש">
        <label class="panel-search">
          <input id="query" type="search" placeholder="שם, סוג או תגית" autocomplete="off" />
        </label>
        <div class="role-row" id="roles" role="group" aria-label="סוג"></div>
        <div class="trait-row" id="traits" role="group" aria-label="סינון"></div>
        <div class="panel-body" id="results"></div>
      </aside>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-label="שינוי גודל המפה" aria-valuemin="28" aria-valuemax="78" aria-valuenow="50" tabindex="0"></div>
      <section class="stage">
        <div id="browse-map" class="trip-map" role="region" aria-label="מפת החיפוש"></div>
      </section>
    </main>
    <footer class="colophon">
      <p>
        חניונים ומסלולים מרשות הטבע והגנים ומטיולי. נקודות המצפור ממפת
        <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
        לפני יציאה צריך לבדוק באתר הרשמי אם המסלול פתוח ואם החניון פנוי.
      </p>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="plan.js"></script>
    <script src="trips.js"></script>
    <script src="split.js"></script>
    <script src="search.js"></script>
  </body>
</html>
