<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>סופ״ש בטבע — מפה ופירוט</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="trip-page">
    <header class="mast trip-mast">
      <p class="eyebrow"><a href="index.html">חזרה לרשימה</a></p>
      <div class="trip-head">
        <h1 id="title">טוען את הסופ״ש…</h1>
        <p id="lead" class="lead"></p>
      </div>
    </header>
    <main class="workspace">
      <aside class="panel" aria-label="הרכבת הסופ״ש">
        <div class="panel-tabs" role="tablist">
          <button type="button" class="tab" id="tab-routes" role="tab" aria-selected="true" aria-controls="around">מסלולים</button>
          <button type="button" class="tab" id="tab-camp" role="tab" aria-selected="false" aria-controls="dossier">חניון</button>
          <button type="button" class="tab" id="tab-detail" role="tab" aria-selected="false" aria-controls="picked">פירוט</button>
        </div>
        <div class="panel-body" id="panel-body">
          <p id="map-note" class="map-note"></p>
          <section id="around" class="around" role="tabpanel"></section>
          <div id="dossier" class="dossier" role="tabpanel" hidden></div>
        </div>
      </aside>
      <section class="stage">
        <div id="map" class="trip-map" role="region" aria-label="מפת החניון והמסלולים"></div>
        <ul id="legend" class="legend"></ul>
      </section>
    </main>
    <footer class="colophon">
      <p>
        הפירוט מאתר
        <a href="https://www.parks.org.il/">רשות הטבע והגנים</a>.
        קו המסלול, כשיש, הוא מנתוני
        <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
        ואינו סימון רשמי. לפני יציאה יש לבדוק שהמסלול פתוח, שהחניון פנוי, ומה המחיר העדכני.
      </p>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="plan.js"></script>
    <script src="trip.js"></script>
  </body>
</html>
