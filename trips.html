<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הטיולים שלי — סופ״ש בטבע</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="browse-page">
    <header class="mast browse-mast">
      <p class="eyebrow"><a href="index.html">חזרה לרשימה</a></p>
      <div class="browse-head">
        <h1>הטיולים שלי</h1>
        <p class="lead">טיוטה נשמרת לבד. עריכה חוזרת לאותה נקודה, ואפשר לשלוח קישור.</p>
      </div>
    </header>
    <main class="workspace">
      <aside class="panel" aria-label="הטיולים השמורים">
        <div class="panel-body" id="library">
          <p class="summary">טוען את הטיולים…</p>
        </div>
      </aside>
      <section class="stage">
        <div id="library-map" class="trip-map" role="region" aria-label="מפת הטיולים השמורים"></div>
      </section>
    </main>
    <footer class="colophon">
      <p>הטיולים נשמרים במכשיר הזה בלבד. מי שמקבל קישור רואה את הטיול, בלי להיכנס לאזור שלך.</p>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="trips.js"></script>
    <script src="library.js"></script>
  </body>
</html>
